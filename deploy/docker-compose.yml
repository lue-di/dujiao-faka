services:
  app:
    # Example: ghcr.io/your-github-owner/dujiao-faka:v1.2.3
    image: ${DJ_IMAGE:?Set DJ_IMAGE in .env to the GHCR image tag to deploy}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # Bind locally; let Nginx/Caddy terminate TLS and proxy to this port.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - app-db:/app/db
      - app-uploads:/app/uploads
      - app-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-db:
  app-uploads:
  app-logs:
  redis-data:
